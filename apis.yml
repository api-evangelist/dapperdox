aid: dapperdox
name: DapperDox
description: >-
  DapperDox is an open-source API documentation generator that creates
  beautiful, customizable reference documentation from OpenAPI specifications.
  It supports theming, overlays, and cross-referencing across multiple API
  specifications, making it suitable for teams managing complex API ecosystems.
  DapperDox is a developer tool rather than a hosted service, so it does not
  expose its own public web API.
